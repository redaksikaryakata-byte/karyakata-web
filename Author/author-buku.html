<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buku Saya — Karyakata.id</title>
    
    <link rel="icon" type="image/png" href="../assets/img/favicon.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: {
                sky: { 50: '#EFF6FF', 100: '#DBEAFE', 200: '#BFDBFE', 300: '#93C5FD', 400: '#4A9EF0', 500: '#0B7BE8', 600: '#0967C7', 700: '#0755A6', 800: '#064485', 900: '#053364' },
                gold: { 100: '#FEF3E2', 200: '#FDE0B5', 300: '#FBC97D', 400: '#F8B84A', 500: '#F5A623', 600: '#D98B0E', 700: '#A86B0A' }
            }, fontFamily: { sans: ['Inter', 'sans-serif'], display: ['"Plus Jakarta Sans"', 'sans-serif'] } } }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * { font-family: 'Inter', sans-serif; }
        .font-display { font-family: 'Plus Jakarta Sans', sans-serif; }
        .sidebar-link { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 12px; font-size: 14px; font-weight: 600; color: #64748B; transition: all .2s ease; }
        .sidebar-link:hover { background: #EFF6FF; color: #0B7BE8; }
        .sidebar-link.active { background: #0B7BE8; color: white; box-shadow: 0 4px 12px rgba(11,123,232,0.3); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 flex flex-col md:flex-row">

    <!-- MOBILE HEADER -->
    <div class="md:hidden bg-white border-b border-slate-200 p-4 flex items-center justify-between sticky top-0 z-40">
        <a href="../index.html" class="flex items-center gap-2">
            <img src="../assets/img/logo.png" alt="Karyakata" class="h-8 w-auto" />
            <span class="font-display text-lg font-black"><span class="text-sky-500">Karyakata</span><span class="text-gold-500">.id</span></span>
        </a>
        <button id="btnMenuMobile" class="w-10 h-10 rounded-lg bg-slate-100 flex items-center justify-center text-slate-600"><i class="fa-solid fa-bars"></i></button>
    </div>

    <!-- SIDEBAR -->
    <aside id="sidebar" class="hidden md:flex w-full md:w-64 bg-white border-r border-slate-200 flex-col fixed md:sticky top-0 h-screen z-50 md:z-0 transition-transform">
        <div class="p-6 border-b border-slate-100 hidden md:block">
            <a href="../index.html" class="flex items-center gap-2">
                <img src="../assets/img/logo.png" alt="Karyakata" class="h-9 w-auto" />
                <span class="font-display text-xl font-black"><span class="text-sky-500">Karyakata</span><span class="text-gold-500">.id</span></span>
            </a>
        </div>
        <nav class="flex-1 p-4 space-y-1 overflow-y-auto">
            <p class="text-[10px] font-bold text-slate-400 tracking-widest uppercase mb-3 px-4">Menu Utama</p>
            <a href="author-dashboard.html" class="sidebar-link"><i class="fa-solid fa-house w-5"></i> Ringkasan</a>
            <a href="author-buku.html" class="sidebar-link active"><i class="fa-solid fa-book w-5"></i> Buku Saya</a>
            <a href="author-penjualan.html" class="sidebar-link"><i class="fa-solid fa-chart-line w-5"></i> Penjualan</a>
            <a href="author-royalti.html" class="sidebar-link"><i class="fa-solid fa-coins w-5"></i> Royalti</a>
            <p class="text-[10px] font-bold text-slate-400 tracking-widest uppercase mb-3 px-4 mt-6">Akun</p>
            <a href="author-profil.html" class="sidebar-link"><i class="fa-solid fa-user w-5"></i> Profil Saya</a>
        </nav>
        <div class="p-4 border-t border-slate-100">
            <div class="flex items-center gap-3 px-4 py-3 bg-slate-50 rounded-xl mb-3">
                <div class="w-9 h-9 rounded-full bg-sky-100 text-sky-600 flex items-center justify-center font-bold text-sm" id="sidebarAvatar">P</div>
                <div class="flex-1 min-w-0">
                    <p class="text-sm font-bold text-slate-800 truncate" id="sidebarNama">Penulis</p>
                    <p class="text-[10px] text-slate-500 truncate" id="sidebarEmail">-</p>
                </div>
            </div>
            <button onclick="doLogout()" class="w-full flex items-center justify-center gap-2 px-4 py-2.5 text-sm font-bold text-red-600 bg-red-50 hover:bg-red-100 rounded-xl transition">
                <i class="fa-solid fa-right-from-bracket"></i> Keluar
            </button>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="flex-1 p-4 md:p-8 lg:p-10 max-w-7xl mx-auto w-full">
        
        <div class="mb-8">
            <h1 class="font-display text-2xl md:text-3xl font-black text-slate-800">Katalog Buku Saya</h1>
            <p class="text-slate-500 text-sm mt-1">Buku-buku Anda yang sudah resmi terbit dan dijual di Karyakata.id.</p>
        </div>

        <!-- LIST BUKU (Grid) -->
        <div id="booksGrid" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="col-span-full text-center py-10 text-slate-400"><i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i><br>Memuat data...</div>
        </div>

    </main>

    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/supabase-client.js"></script>
    <script src="../assets/js/author-guard.js"></script>

    <script>
        const btnMenu = document.getElementById('btnMenuMobile');
        const sidebar = document.getElementById('sidebar');
        if(btnMenu) btnMenu.addEventListener('click', () => sidebar.classList.toggle('hidden'));

        async function doLogout() {
            if(confirm('Yakin ingin keluar?')) {
                await authorLogout();
                window.location.replace('author-login.html');
            }
        }

        async function loadBooks() {
            const checkGuard = setInterval(async () => {
                if (window.__author) {
                    clearInterval(checkGuard);
                    
                    document.getElementById('sidebarNama').textContent = window.__author.nama;
                    document.getElementById('sidebarEmail').textContent = window.__author.email;
                    document.getElementById('sidebarAvatar').textContent = window.__author.nama.charAt(0).toUpperCase();

                    const res = await authorGetBooks(); 
                    if (res.success) {
                        renderBooks(res.books);
                    } else {
                        document.getElementById('booksGrid').innerHTML = `<div class="col-span-full text-center py-10 text-red-500">Gagal memuat: ${res.error}</div>`;
                    }
                }
            }, 100);
        }

        function renderBooks(books) {
            const grid = document.getElementById('booksGrid');
            
            if (!books || books.length === 0) {
                grid.innerHTML = `<div class="col-span-full bg-white rounded-2xl border border-slate-200 p-12 text-center">
                    <div class="w-16 h-16 bg-slate-50 rounded-full flex items-center justify-center mx-auto mb-4 text-slate-300 text-2xl"><i class="fa-solid fa-book-open"></i></div>
                    <h3 class="font-bold text-slate-700 mb-1">Belum ada buku di sini</h3>
                    <p class="text-sm text-slate-500 mb-4">Buku Anda akan muncul di sini setelah admin merilisnya ke katalog.</p>
                </div>`;
                return;
            }

            let html = '';
            books.forEach(b => {
                // Render Cover (Anti-kedip)
                let imgHtml = '';
                if (b.cover_url) {
                    const cover = b.cover_url.startsWith('http') ? b.cover_url : supabaseClient.storage.from('covers').getPublicUrl(b.cover_url).data.publicUrl;
                    imgHtml = `<img src="${cover}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                               <div class="hidden w-full h-full flex-col items-center justify-center bg-sky-50 text-sky-300"><i class="fa-solid fa-book text-5xl mb-2"></i><p class="text-[10px] px-4 text-center">${b.judul}</p></div>`;
                } else {
                    imgHtml = `<div class="w-full h-full flex flex-col items-center justify-center bg-sky-50 text-sky-300"><i class="fa-solid fa-book text-5xl mb-2"></i><p class="text-[10px] px-4 text-center">${b.judul}</p></div>`;
                }

                html += `
                    <!-- Seluruh kartu dibungkus dalam link agar jika diklik mengarah ke katalog publik -->
                    <a href="../buku-detail.html?id=${b.id}" target="_blank" class="bg-white rounded-2xl border border-slate-200 overflow-hidden hover:shadow-lg hover:border-sky-300 transition group flex flex-col relative">
                        
                        <!-- Badge Terbit -->
                        <div class="absolute top-3 left-3 z-10">
                            <span class="px-2.5 py-1 bg-green-500 text-white text-[10px] font-bold rounded-lg shadow-sm">
                                <i class="fa-solid fa-check-circle mr-1"></i> Terbit
                            </span>
                        </div>

                        <!-- Area Cover / Gambar -->
                        <div class="h-64 bg-slate-100 relative overflow-hidden flex-shrink-0">
                            ${imgHtml}
                        </div>

                        <!-- Info Buku -->
                        <div class="p-5 flex-1 flex flex-col">
                            <h3 class="font-display font-black text-lg text-slate-800 leading-tight mb-1 group-hover:text-sky-600 transition">${b.judul}</h3>
                            <p class="text-xs text-slate-500 mb-2">${b.genre} ${b.sub_genre ? '• ' + b.sub_genre : ''}</p>
                            <p class="text-sm font-bold text-sky-600 mb-4">${rp(b.harga)}</p>
                            
                            <div class="mt-auto pt-4 border-t border-slate-100">
                                <span class="text-xs font-bold text-slate-500 flex items-center justify-between group-hover:text-sky-500 transition">
                                    Lihat Detail di Katalog 
                                    <i class="fa-solid fa-arrow-right transform group-hover:translate-x-1 transition"></i>
                                </span>
                            </div>
                        </div>
                    </a>
                `;
            });
            grid.innerHTML = html;
        }

        loadBooks();
    </script>
</body>
</html>
